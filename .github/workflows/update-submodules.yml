name: Update Submodules

on:
  repository_dispatch:
    types: [plugin-updated]
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to update (leave empty for all)'
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.REPO_PAT }}

      - name: Update submodules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update submodules to latest remote commit (no merge)
          git submodule foreach 'git fetch origin && git checkout origin/main'

          # Sync versions from plugin.json to marketplace.json
          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            plugin_json="$plugin_dir/.claude-plugin/plugin.json"

            if [ -f "$plugin_json" ]; then
              version=$(jq -r '.version' "$plugin_json")
              echo "Syncing $plugin_name version: $version"

              # Update version in marketplace.json
              jq --arg name "$plugin_name" --arg ver "$version" \
                '(.plugins[] | select(.name == $name)).version = $ver' \
                .claude-plugin/marketplace.json > tmp.json
              mv tmp.json .claude-plugin/marketplace.json
            fi
          done

          # Check if there are changes
          if git diff --quiet; then
            echo "No submodule updates"
            exit 0
          fi

          # Commit and push
          git add .
          git commit -m "chore: Update plugin submodules

          Triggered by: ${{ github.event_name }}
          Plugin: ${{ github.event.client_payload.plugin || 'all' }}"
          git push
